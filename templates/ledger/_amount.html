<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="amountwrap"><span aria-hidden="true">₹</span>{{ field }}</div>
  {% if hint %}<div class="hint">{{ hint }}</div>{% endif %}
  {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
</div>
