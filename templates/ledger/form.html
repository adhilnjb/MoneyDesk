{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="pagehead"><h1>{{ title }}</h1></div>
<form method="post" class="card form" novalidate>{% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}{% include "ledger/_field.html" %}{% endfor %}
  <button class="btn" type="submit">Save</button> <a class="btn ghost" href="{% url back %}">Cancel</a>
</form>
{% endblock %}
