{% extends "base.html" %}
{% block title %}Two-factor check{% endblock %}
{% block auth %}
<div class="card">
  <h1>Enter your code</h1>
  <p class="muted">Open your authenticator app and type the 6-digit code, or use a recovery code.</p>
  {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
  <form method="post" novalidate>{% csrf_token %}
    <div class="field"><label for="code">Code</label><input class="input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required></div>
    <button class="btn full" type="submit">Verify</button>
  </form>
  <p class="small muted"><a href="{% url 'accounts:login' %}">Start again</a></p>
</div>
{% endblock %}
